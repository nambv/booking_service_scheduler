      description: "Flipping the status to `cancelled` frees the bay and the
        technician immediately, because both exclusion constraints are scoped to
        `WHERE status = 'confirmed'`. No compensating write is needed.
        Idempotent: cancelling an already-cancelled appointment returns it
        unchanged. An appointment whose service has already started cannot be
        cancelled."
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
          in: path
          name: id
          required: true
          description: The appointment to cancel
      responses:
        "200":
          description: A confirmed appointment
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
