openapi: 3.1.0
info:
  title: Unified Service Scheduler
  version: 0.1.0
  description: >-
    Books vehicle service appointments at a dealership. A booking is confirmed
    only when

    both a service bay and a technician qualified for the requested service are
    free for

    the entire duration of the job.


    The non-overlap invariant is enforced by PostgreSQL `EXCLUDE USING gist`
    constraints,

    not by application code. `GET /availability` is advisory: between checking
    and booking,

    another caller can take the last pair, which is why a booking can still
    return 409.


    Time ranges are half-open `[start, end)`. An appointment ending at 10:00 and
    one

    starting at 10:00 do not conflict.
  license:
    name: Proprietary — technical assessment submission
    identifier: LicenseRef-Proprietary
components:
  schemas: {}
paths:
  /appointments:
    post:
      operationId: bookAppointment
      summary: Book an appointment
      tags:
        - Scheduling
      description: The client supplies a start instant only; the end is derived from
        the service type's duration, so a caller cannot understate a job to fit
        a gap. On losing a race for the last free pair the service re-selects a
        different technician or bay for the same time, up to a bounded number of
        attempts. It never moves the booking to a different time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                  description: An 8-4-4-4-12 identifier
                vehicleId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                  description: An 8-4-4-4-12 identifier
                dealershipId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                  description: An 8-4-4-4-12 identifier
                serviceTypeId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                  description: An 8-4-4-4-12 identifier
                startTime:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                  description: ISO 8601 instant with offset
              required:
                - customerId
                - vehicleId
                - dealershipId
                - serviceTypeId
                - startTime
              description: A booking request. The end time is derived server-side from the
                service type.
        description: A booking request. The end time is derived server-side from the
          service type.
      responses:
        "201":
          description: A confirmed appointment
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                    description: An 8-4-4-4-12 identifier
                  customerId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                    description: An 8-4-4-4-12 identifier
                  vehicleId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                    description: An 8-4-4-4-12 identifier
                  dealershipId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                    description: An 8-4-4-4-12 identifier
                  serviceTypeId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                    description: An 8-4-4-4-12 identifier
                  technicianId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                    description: "Chosen by the server: the least-loaded qualified technician, ties
                      broken at random"
                  serviceBayId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                    description: An 8-4-4-4-12 identifier
                  startTime:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                    description: ISO 8601 instant with offset
                  endTime:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                    description: "Exclusive: ranges are half-open [start, end)"
                  status:
                    type: string
                    enum:
                      - confirmed
                      - cancelled
                required:
                  - id
                  - customerId
                  - vehicleId
                  - dealershipId
                  - serviceTypeId
                  - technicianId
                  - serviceBayId
                  - startTime
                  - endTime
                  - status
                additionalProperties: false
                description: A confirmed appointment
        "400":
          description: Error envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
