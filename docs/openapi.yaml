  /availability:
    get:
      operationId: checkAvailability
      summary: Check whether a booking would succeed
      tags:
        - Scheduling
      description: Advisory only — it does not take the slot. A true result can still
        be followed by a 409 from POST /appointments if another caller books in
        between.
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
          in: query
          name: dealershipId
          required: true
          description: An 8-4-4-4-12 identifier
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
          in: query
          name: serviceTypeId
          required: true
          description: An 8-4-4-4-12 identifier
        - schema:
            type: string
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
          in: query
          name: startTime
          required: true
          description: ISO 8601 instant with offset
      responses:
        "200":
