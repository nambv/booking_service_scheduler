services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports:
      # Deliberately not 5432: developers commonly already have a Postgres bound
      # there. Integration tests use Testcontainers and pick their own port.
      - '55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scheduler -d scheduler']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
